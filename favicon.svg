<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0D1B2A"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#C0272D" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FAA21B" stroke-width="8" stroke-dasharray="16 12"/>
  <g id="vector-crane" transform="translate(0, 0)">
    <!-- Base block of the crane -->
    <path d="M196,380 L316,380 L296,356 L216,356 Z" fill="#FAA21B" />
    
    <!-- Vertical lattice mast -->
    <rect x="248" y="140" width="16" height="216" fill="#FAA21B" />
    <line x1="248" y1="140" x2="264" y2="180" stroke="#0D1B2A" stroke-width="3" />
    <line x1="264" y1="180" x2="248" y2="220" stroke="#0D1B2A" stroke-width="3" />
    <line x1="248" y1="220" x2="264" y2="260" stroke="#0D1B2A" stroke-width="3" />
    <line x1="264" y1="260" x2="248" y2="300" stroke="#0D1B2A" stroke-width="3" />
    <line x1="248" y1="300" x2="264" y2="340" stroke="#0D1B2A" stroke-width="3" />

    <!-- Mast top peak (A-frame) -->
    <polygon points="248,140 264,140 256,90" fill="#FAA21B" />

    <!-- Horizontal boom / jib -->
    <rect x="116" y="134" width="280" height="12" fill="#FAA21B" />

    <!-- Left side support cables (stays) -->
    <line x1="256" y1="90" x2="150" y2="134" stroke="#FAA21B" stroke-width="4" />
    <!-- Right side support cables (stays) -->
    <line x1="256" y1="90" x2="340" y2="134" stroke="#FAA21B" stroke-width="4" />

    <!-- Counterweight -->
    <rect x="130" y="146" width="36" height="24" fill="#C0272D" rx="4" />

    <!-- Operator Cabin -->
    <rect x="224" y="146" width="20" height="24" fill="#FFFFFF" rx="4" />
    <rect x="228" y="150" width="8" height="10" fill="#0D1B2A" />

    <!-- Hook trolley & rope -->
    <rect x="310" y="146" width="16" height="8" fill="#FAA21B" />
    <line x1="318" y1="154" x2="318" y2="250" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- Hook/Load -->
    <circle cx="318" cy="256" r="10" fill="#FAA21B" />
    <path d="M314,262 C312,266 322,266 320,262" fill="none" stroke="#C0272D" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>